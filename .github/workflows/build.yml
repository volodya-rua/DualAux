name: build
on: [push, workflow_dispatch]

jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: dualaux-${{ runner.os }}
          path: |
            target/release/dualaux
            target/release/dualaux.exe
