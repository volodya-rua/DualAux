[package]
name = "dualaux"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Volodya"]
repository = "https://github.com/volodya-rua/DualAux"
description = "Play audio on up to five headphones at once"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
tray-icon = { version = "0.19", default-features = false }

[target.'cfg(unix)'.dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
